name: .NET CI (shared)

# The pipeline behind retroboard-ci.yml and planningpoker-ci.yml; those two decide *when* it runs
# (path filters), this file decides *what* runs. Everything project-specific derives from the
# `project` input by convention: the folder, <project>.slnx, src/<project>.*, the
# <project>-vX.Y.Z git tag, and the ghcr.io/<owner>/<project> image (lowercased by
# docker/metadata-action).
on:
  workflow_call:
    inputs:
      project:
        description: Project folder name, e.g. RetroBoard
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ inputs.project }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.project }}/global.json

      - name: Restore
        run: dotnet restore ${{ inputs.project }}.slnx

      - name: Build
        run: dotnet build ${{ inputs.project }}.slnx --no-restore -c Release /nodeReuse:false

      - name: Test
        run: >
          dotnet test ${{ inputs.project }}.slnx --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: ${{ inputs.project }}/coverage/**/coverage.cobertura.xml
          targetdir: ${{ inputs.project }}/coverage/report
          reporttypes: Html;MarkdownSummaryGithub;Badges

      - name: Add coverage summary to job summary
        run: cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: ${{ inputs.project }}/coverage/report/

      - name: Update coverage badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p badges
          cp ./coverage/report/badge_linecoverage.svg badges/line_coverage.svg
          cp ./coverage/report/badge_branchcoverage.svg badges/branch_coverage.svg

      # A push touching both projects runs both pipelines at once, each committing badges to the
      # same `main`, so this has to survive losing that race: a rejected push here would fail
      # `test` and with it the image release. Rebasing is safe because this job only ever commits
      # its own project's generated badge files.
      - name: Commit updated badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/*.svg
          if git diff --cached --quiet; then
            echo "Coverage badges unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore(${{ inputs.project }}): update coverage badges [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((attempt * 5))
          done
          echo "Could not push coverage badges after 5 attempts." >&2
          exit 1

  # Tracks the Blazor WASM download size -- "the primary perf metric users actually feel" (see each
  # project's REQUIREMENTS.MD). Deliberately not in `release`'s `needs:`: perf checks don't gate
  # every commit the way the test suite does.
  bundle-size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.project }}/global.json

      - name: Check bundle size
        shell: pwsh
        run: ./src/${{ inputs.project }}.Client/scripts/check-bundle-size.ps1

  # Micro-benchmarks for domain hot paths and JSON serialization (see each project's
  # REQUIREMENTS.MD). `--job short` trades precision for a runtime that fits a shared CI runner;
  # same non-gating treatment as bundle-size -- these track trends, they don't block a commit over
  # CI-runner noise.
  benchmarks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project }}/src/${{ inputs.project }}.Tests.Benchmarks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.project }}/global.json

      - name: Run benchmarks
        run: dotnet run -c Release -- --filter '*' --job short

      - name: Add report to job summary
        if: always()
        run: |
          for f in BenchmarkDotNet.Artifacts/results/*-report-github.md; do
            echo "### $(basename "$f" -report-github.md)" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: ${{ inputs.project }}/src/${{ inputs.project }}.Tests.Benchmarks/BenchmarkDotNet.Artifacts/

  # Gated on `test`, so the version bump and image push never happen on a broken build.
  release:
    needs: test
    if: github.event_name == 'release' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The per-project tag_prefix keeps each project on its own version line. fetch_all_tags is
      # needed because the action otherwise reads only 100 tags, and two projects share this repo's
      # tag list. The bump level still comes from every commit since this project's last tag,
      # including the other project's: a `feat:` over there can make this project's next bump
      # minor instead of patch. A manual run with no new commits still bumps, via default_bump.
      - name: Bump version and push tag
        id: tag_version
        if: github.event_name != 'release'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: ${{ inputs.project }}-v
          fetch_all_tags: true

      - name: Determine image version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          NEW_VERSION: ${{ steps.tag_version.outputs.new_version }}
          PROJECT: ${{ inputs.project }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # RetroBoard-v1.2.3 -> v1.2.3, the same image tag a release produced before the prefix.
            echo "version=${RELEASE_TAG#"$PROJECT"-}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.project }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
