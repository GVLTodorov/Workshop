name: RetroBoard CI

# Runs only when RetroBoard or its pipeline changes. Path filters don't apply to `release` events,
# so the job-level `if` below keeps a PlanningPoker-v* release from also building this project.
on:
  push:
    branches:
      - main
      - beta
    paths:
      - RetroBoard/**
      - .github/workflows/retroboard-ci.yml
      - .github/workflows/dotnet-ci.yml
  pull_request:
    paths:
      - RetroBoard/**
      - .github/workflows/retroboard-ci.yml
      - .github/workflows/dotnet-ci.yml
  release:
    types:
      - created

permissions:
  contents: write
  packages: write

jobs:
  ci:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'RetroBoard-v')
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      project: RetroBoard
