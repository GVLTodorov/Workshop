name: PlanningPoker CI

# Runs only when PlanningPoker or its pipeline changes. Path filters don't apply to `release` events,
# so the job-level `if` below keeps a RetroBoard-v* release from also building this project.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - beta
    paths:
      - PlanningPoker/**
      - .github/workflows/planningpoker-ci.yml
      - .github/workflows/dotnet-ci.yml
  pull_request:
    paths:
      - PlanningPoker/**
      - .github/workflows/planningpoker-ci.yml
      - .github/workflows/dotnet-ci.yml
  release:
    types:
      - created

permissions:
  contents: write
  packages: write

jobs:
  ci:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'PlanningPoker-v')
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      project: PlanningPoker
